<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <rect width="800" height="220" fill="transparent" />

  <!-- Background Lines -->
  <line x1="20" y1="20" x2="20" y2="200" stroke="#30363d" stroke-width="1" />
  
  <!-- Active Animated Line (FiduScan) with SMIL animation -->
  <line x1="20" y1="20" x2="20" y2="60" stroke="#58a6ff" stroke-width="2" stroke-dasharray="40" stroke-dashoffset="40">
    <animate attributeName="stroke-dashoffset" values="40;0;40" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Item 1 -->
  <text x="40" y="35">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14px" fill="#8b949e" letter-spacing="1px">01 / </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="600" fill="#e1e4e8" letter-spacing="2px">FIDUSCAN</tspan>
  </text>
  <text x="40" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11px" fill="#8b949e" letter-spacing="1px">DIGITAL MEDIA FORENSICS</text>

  <!-- Item 2 -->
  <text x="40" y="85">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14px" fill="#8b949e" letter-spacing="1px">02 / </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="600" fill="#e1e4e8" letter-spacing="2px">TRACE</tspan>
  </text>
  <text x="40" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11px" fill="#8b949e" letter-spacing="1px">ENVIRONMENTAL INTELLIGENCE</text>

  <!-- Item 3 -->
  <text x="40" y="135">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14px" fill="#8b949e" letter-spacing="1px">03 / </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="600" fill="#e1e4e8" letter-spacing="2px">SONIC RIDE</tspan>
  </text>
  <text x="40" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11px" fill="#8b949e" letter-spacing="1px">SMART MOBILITY</text>
  
  <!-- Item 4 -->
  <text x="40" y="185">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14px" fill="#8b949e" letter-spacing="1px">04 / </tspan>
    <tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14px" font-weight="600" fill="#e1e4e8" letter-spacing="2px">CYBERSCOPE</tspan>
  </text>
  <text x="40" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11px" fill="#8b949e" letter-spacing="1px">SOC ASSESSMENT</text>
</svg>
