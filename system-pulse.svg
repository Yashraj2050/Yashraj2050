<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      @keyframes pulse {
        0% { opacity: 0.3; stroke-width: 1; }
        50% { opacity: 1; stroke-width: 2; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4)); }
        100% { opacity: 0.3; stroke-width: 1; }
      }
      @keyframes flow {
        to { stroke-dashoffset: -40; }
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #e1e4e8;
        letter-spacing: 2px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 10px;
        fill: #8b949e;
        letter-spacing: 1px;
      }
      .line {
        stroke: #30363d;
        stroke-width: 1;
        fill: none;
      }
      .line-active {
        stroke: #58a6ff;
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 4 8;
        animation: flow 2s linear infinite;
      }
      .node {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 2;
      }
      .node-core {
        fill: #58a6ff;
        animation: pulse 3s infinite;
      }
    </style>
  </defs>

  <!-- Background / Grid -->
  <rect width="800" height="300" fill="#0d1117" />
  
  <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250" stroke="#161b22" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300" stroke="#161b22" stroke-width="1" />

  <!-- Connections -->
  <path class="line" d="M 200 100 L 400 150 L 600 100" />
  <path class="line" d="M 200 200 L 400 150 L 600 200" />
  <path class="line" d="M 400 50 L 400 150 L 400 250" />
  
  <!-- Active Connections -->
  <path class="line-active" d="M 200 100 L 400 150" />
  <path class="line-active" d="M 600 200 L 400 150" style="animation-direction: reverse; animation-duration: 3s;" />
  <path class="line-active" d="M 400 50 L 400 150" style="animation-duration: 2.5s;" />

  <!-- Central Node -->
  <circle cx="400" cy="150" r="25" class="node" />
  <circle cx="400" cy="150" r="8" class="node-core" />
  
  <!-- Nodes & Text -->
  
  <!-- AI / ML -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="15" class="node" />
    <circle cx="0" cy="0" r="3" fill="#8b949e" />
    <text x="-40" y="-25" class="node-text">AI / ML</text>
    <text x="-40" y="-10" class="sub-text">MULTIMODAL INTELLIGENCE</text>
  </g>

  <!-- Data -->
  <g transform="translate(600, 100)">
    <circle cx="0" cy="0" r="15" class="node" />
    <circle cx="0" cy="0" r="3" fill="#8b949e" />
    <text x="-15" y="-25" class="node-text">DATA</text>
    <text x="-15" y="-10" class="sub-text">SYSTEMS &amp; ORCHESTRATION</text>
  </g>

  <!-- Security -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="15" class="node" />
    <circle cx="0" cy="0" r="3" fill="#8b949e" />
    <text x="-50" y="30" class="node-text">SECURITY</text>
    <text x="-50" y="45" class="sub-text">DIGITAL FORENSICS</text>
  </g>

  <!-- Engineering -->
  <g transform="translate(600, 200)">
    <circle cx="0" cy="0" r="15" class="node" />
    <circle cx="0" cy="0" r="3" fill="#8b949e" />
    <text x="-25" y="30" class="node-text">ENGINEERING</text>
    <text x="-25" y="45" class="sub-text">FULL-STACK ARCHITECTURE</text>
  </g>

</svg>
